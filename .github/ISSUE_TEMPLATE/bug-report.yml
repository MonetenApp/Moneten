name: Bug report
description: Something in the app does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include PINs, TANs, IBANs, account numbers, or amounts. To report a security problem, follow SECURITY.md instead.
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected and what happened
    validations:
      required: true
