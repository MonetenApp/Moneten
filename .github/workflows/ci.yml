name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-ui.py
      - run: npm install -g @fission-ai/openspec
      - run: openspec validate --all --strict --no-interactive
      # Offline: lua.org resets connections from CI runners.
      - run: scripts/vendor-lua.sh --check
      - run: scripts/vendor-lua.sh --self-test

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: swift --version
      - run: brew install xcodegen
      # The made-up bank of the ext record tests. macOS 15 does not resolve names under localhost.
      - run: echo "127.0.0.1 bank.localhost" | sudo tee -a /etc/hosts
      - name: Tests
        # The performance tests run below, alone and in a release build. Here they would keep the three
        # cores of the runner busy while the FinTS tests measure how fast a helper ends.
        run: scripts/test.sh --skip PerformanceTests
      - name: Example extension
        # The replay that the checks of the catalog repository run for each package.
        run: swift run --disable-keychain ext test Extensions/Example Fixtures/example/fixture.json Fixtures/example/expected.json
      - name: Published extensions
        # Three published extensions, unchanged, against their hand-made fixtures. CompatibilityTests checks their digests.
        run: |
          for extension in "permanent-tsb-business/Permanent TSB Business.lua" monzo/Monzo.lua amazon-bestellungen/amazon-bestellungen.lua; do
            folder="Fixtures/extensions/${extension%%/*}"
            swift run --disable-keychain ext test "Fixtures/extensions/$extension" "$folder/fixture.json" "$folder/expected.json"
          done
      - name: Performance
        # The budgets of the performance tests hold for a release build only. See CONTRIBUTING.md.
        # The tests run one after another, so that no test measures the load of another one.
        run: scripts/test.sh -c release -Xswiftc -enable-testing --filter PerformanceTests --no-parallel
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: FinTS helper
        # Compiles Tools/FinTSHelper against the jars of dependencies.lock and runs its self-test.
        run: scripts/build-fints-helper.sh
      # Adds the FinTS helper with a jlink runtime to the app.
      - run: scripts/build-app.sh debug
      - name: UI performance
        run: scripts/perf-check.sh
      - name: FinTS prototype
        run: xcodebuild -project App/Moneten.xcodeproj -scheme FinTSProbe -derivedDataPath .build/xcode -disableAutomaticPackageResolution -quiet build
      - name: FinTS probe with hbci4java
        # Downloads the jars of Tools/FinTSProbeJava/dependencies.lock, checks their SHA-256, and compiles the probe.
        run: scripts/fints-probe-java.sh --build-only
      - name: Unused code
        # The Periphery repository is archived, and Homebrew drops its formula in August 2027.
        # CI uses the last release, checked against its hash.
        run: |
          curl -sSL -o periphery.zip https://github.com/peripheryapp/periphery/releases/download/3.8.0/periphery-3.8.0.zip
          echo "07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7  periphery.zip" | shasum -a 256 -c
          unzip -q periphery.zip -d .build/periphery-tool
          .build/periphery-tool/periphery scan
