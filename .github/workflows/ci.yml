name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.plan.outputs.macos }}
      app: ${{ steps.plan.outputs.app }}
      periphery: ${{ steps.plan.outputs.periphery }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: python3 scripts/test-ci.py
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE...$HEAD" > "$RUNNER_TEMP/paths"
          else
            : > "$RUNNER_TEMP/paths"
          fi
          python3 scripts/ci-plan.py "$EVENT" < "$RUNNER_TEMP/paths" |
            python3 -c 'import json,sys; [print(f"{k}={str(v).lower()}") for k,v in json.load(sys.stdin).items()]' >> "$GITHUB_OUTPUT"

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: python3 scripts/check-docs.py
      - run: python3 scripts/check-ui.py
      # The format of CHANGELOG.md, the only source of the release notes, and the tests of its script.
      - run: python3 scripts/release-notes.py check
      - run: python3 scripts/test-release-notes.py
      - run: scripts/check-catalog-keys.sh
      - run: npm install -g @fission-ai/openspec
      - run: openspec validate --all --strict --no-interactive
      - run: scripts/vendor-lua.sh --check
      - run: scripts/vendor-lua.sh --self-test

  unit:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
        with:
          java: 'true'
      - run: echo "127.0.0.1 bank.localhost" | sudo tee -a /etc/hosts
      - name: Unit tests
        run: |
          scripts/ci-run.sh scripts/test.sh --skip 'FinTSTests\.|PerformanceTests|LimitTests'
          scripts/ci-run.sh scripts/test.sh --skip-build --filter '^FinTSTests\.'
      - name: Export durability
        run: scripts/ci-run.sh scripts/check-export-sync.sh
      - name: FinTS helper and probe
        run: |
          scripts/ci-run.sh scripts/build-fints-helper.sh
          scripts/ci-run.sh scripts/fints-probe-java.sh --build-only
      - name: Extension replays
        run: |
          scripts/ci-run.sh swift run --disable-keychain ext test Extensions/Example Fixtures/example/fixture.json Fixtures/example/expected.json
          for extension in "permanent-tsb-business/Permanent TSB Business.lua" monzo/Monzo.lua amazon-bestellungen/amazon-bestellungen.lua; do
            folder="Fixtures/extensions/${extension%%/*}"
            scripts/ci-run.sh swift run --disable-keychain ext test "Fixtures/extensions/$extension" "$folder/fixture.json" "$folder/expected.json"
          done

  performance:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
      - name: Release performance
        run: scripts/ci-run.sh scripts/test.sh -c release -Xswiftc -enable-testing --filter 'PerformanceTests|SessionTests/testHosts|LimitTests' --no-parallel

  app:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/ci-setup
        with:
          xcodegen: 'true'
          java: 'true'
      - name: Build Perf app
        run: scripts/ci-run.sh scripts/build-app.sh perf
      - if: needs.changes.outputs.app == 'true'
        name: No personal data in the debug log
        run: scripts/ci-run.sh scripts/check-debug-log.sh
      - if: needs.changes.outputs.periphery == 'true'
        uses: actions/cache@v5
        with:
          path: .build/periphery.zip
          key: periphery-3.8.0-07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7
      - if: needs.changes.outputs.periphery == 'true'
        name: Unused code
        run: |
          test -f .build/periphery.zip || curl -fsSL -o .build/periphery.zip https://github.com/peripheryapp/periphery/releases/download/3.8.0/periphery-3.8.0.zip
          echo "07d4e286e31dd79164df39097e0b59f533c94badbe18158464a455ea88a166d7  .build/periphery.zip" | shasum -a 256 -c
          unzip -q .build/periphery.zip -d .build/periphery-tool
          scripts/ci-run.sh xcodebuild -project App/Moneten.xcodeproj -scheme ext -configuration Perf -destination 'platform=macOS,arch=arm64' -derivedDataPath .build/xcode -quiet build CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES OTHER_SWIFT_FLAGS="\$(inherited) -D PERF_HARNESS -index-store-path \"$PWD/.build/xcode/Index.noindex/DataStore\""
          scripts/ci-run.sh .build/periphery-tool/periphery scan --skip-build --index-store-path .build/xcode/Index.noindex/DataStore
      - name: Package UI performance app
        run: tar -cf "$RUNNER_TEMP/perf-app.tar" -C dist Moneten.app
      - if: needs.changes.outputs.app == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: perf-app
          path: ${{ runner.temp }}/perf-app.tar
          retention-days: 1

  ui:
    needs: [changes, app]
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/2', '2/2']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: perf-app
          path: ${{ runner.temp }}
      - name: UI performance
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p .build/xcode/Build/Products/Perf
          tar -xf "$RUNNER_TEMP/perf-app.tar" -C .build/xcode/Build/Products/Perf
          scripts/ci-run.sh scripts/perf-check.sh --skip-build --shard "$SHARD"
