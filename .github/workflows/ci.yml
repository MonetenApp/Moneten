name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/check-docs.py
      - run: npm install -g @fission-ai/openspec
      - run: openspec validate --all --strict --no-interactive

  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: scripts/test.sh
      - run: scripts/build-app.sh debug
      - name: Unused code
        run: |
          brew install periphery
          swift build --disable-keychain --build-tests --build-system native --scratch-path .build/periphery
          periphery scan --skip-build --index-store-path .build/periphery/debug/index/store
