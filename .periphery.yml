# Unused-code check, run by scripts/check.sh on the Xcode project, which builds the app and the libraries.
# The models are Codable records: GRDB reads and writes their properties, which Periphery cannot see.
project: App/Moneten.xcodeproj
schemes:
  - Moneten
retain_codable_properties: true
relative_results: true
strict: true
# The sync model is the contract for the bank connectors. The app reads its results once the FinTS
# connector (issue #13) and the merge of transactions (issue #7) exist. Remove these lines then.
retain_files:
  - Sources/Domain/Sync/*.swift
  - Sources/SyncTesting/*.swift
