# The Xcode project of the app. Generate it with scripts/generate-project.sh.
# The libraries Domain, Storage, and Import stay in the Swift package at the repository root.
name: MonetenMoneten
options:
  bundleIdPrefix: io.github.alexander-schneider
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
packages:
  MonetenMonetenKit:
    path: ..
targets:
  MonetenMoneten:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MonetenMonetenKit
        product: Domain
      - package: MonetenMonetenKit
        product: Storage
      - package: MonetenMonetenKit
        product: Import
    settings:
      base:
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.MonetenMoneten
        PRODUCT_NAME: MonetenMoneten
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: MonetenMoneten.entitlements
        ENABLE_HARDENED_RUNTIME: $(MONETENMONETEN_HARDENED_RUNTIME)
  # The FinTS prototype of issue #11. It runs in the terminal. App/FinTSProbe/main.swift explains it.
  FinTSProbe:
    type: application
    platform: macOS
    sources:
      - path: FinTSProbe
    dependencies:
      # Built from Vendor/HBCI4Swift by scripts/build-hbci4swift.sh.
      - framework: ../.build/hbci4swift/HBCI4Swift.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.FinTSProbe
        PRODUCT_NAME: FinTSProbe
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: $(MONETENMONETEN_HARDENED_RUNTIME)
schemes:
  MonetenMoneten:
    build:
      targets:
        MonetenMoneten: all
    run:
      config: Debug
    archive:
      config: Release
  FinTSProbe:
    build:
      targets:
        FinTSProbe: all
    run:
      config: Debug
