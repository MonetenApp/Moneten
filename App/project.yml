# The Xcode project of the app. Generate it with scripts/generate-project.sh.
# The libraries Domain, Storage, Import, Sync, SyncTesting, FinTS, ExtensionHost, and ExtensionConnector stay in the Swift package at the repository root.
name: Moneten
options:
  bundleIdPrefix: io.github.alexander-schneider
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false
# Perf is optimized like Release and contains the debug harness, for scripts/perf-check.sh.
configs:
  Debug: debug
  Release: release
  Perf: release
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
  Perf: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
packages:
  MonetenKit:
    path: ..
targets:
  Moneten:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
    dependencies:
      - package: MonetenKit
        product: Domain
      - package: MonetenKit
        product: Storage
      - package: MonetenKit
        product: Import
      - package: MonetenKit
        product: Sync
      - package: MonetenKit
        product: FinTS
      # The scripted connector of the previews and of the debug harness.
      - package: MonetenKit
        product: SyncTesting
      - package: MonetenKit
        product: ExtensionHost
      - package: MonetenKit
        product: ExtensionConnector
      # The process of one extension session, which ExtensionHostClient starts from Contents/Helpers.
      - target: MonetenExtensionHost
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.Moneten
        PRODUCT_NAME: Moneten
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: Moneten.entitlements
        # A muted slate blue for selections and controls, calmer than the system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: $(MONETEN_HARDENED_RUNTIME)
      configs:
        Perf:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERF_HARNESS
  # The host process of ADR 0015: the main of the package target MonetenExtensionHost, with the app sandbox
  # and only outgoing connections. No base entitlements are added, so a debug build cannot be attached to either.
  MonetenExtensionHost:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/MonetenExtensionHost
    dependencies:
      - package: MonetenKit
        product: ExtensionHost
    settings:
      base:
        PRODUCT_NAME: MonetenExtensionHost
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.Moneten.ExtensionHost
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: ExtensionHost.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: $(MONETEN_HARDENED_RUNTIME)
        SKIP_INSTALL: YES
  # The FinTS prototype of issue #11. It runs in the terminal. App/FinTSProbe/main.swift explains it.
  FinTSProbe:
    type: application
    platform: macOS
    sources:
      - path: FinTSProbe
    dependencies:
      # Built from Vendor/HBCI4Swift by scripts/build-hbci4swift.sh.
      - framework: ../.build/hbci4swift/HBCI4Swift.framework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.FinTSProbe
        PRODUCT_NAME: FinTSProbe
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: $(MONETEN_HARDENED_RUNTIME)
schemes:
  Moneten:
    build:
      targets:
        Moneten: all
    run:
      config: Debug
    archive:
      config: Release
  FinTSProbe:
    build:
      targets:
        FinTSProbe: all
    run:
      config: Debug
