# The Xcode project of the app. Generate it with scripts/generate-project.sh.
# The libraries Domain, Storage, Import, Sync, SyncTesting, FinTS, ExtensionHost, ExtensionConnector, and ExtensionCatalog stay in the Swift package at the repository root.
name: Moneten
options:
  bundleIdPrefix: io.github.alexander-schneider
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  # English is the language of the code. App/Resources/Localizable.xcstrings holds German as well.
  developmentLanguage: en
  generateEmptyDirectories: false
# Perf is optimized like Release and contains the debug harness, for scripts/perf-check.sh.
configs:
  Debug: debug
  Release: release
  Perf: release
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
  Perf: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEAD_CODE_STRIPPING: YES
  # A release keeps the dSYMs of its build next to its disk image, and scripts/symbolicate-crash.sh
  # reads them (docs/releasing.md). The release preset of XcodeGen sets this too.
  configs:
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
packages:
  MonetenKit:
    path: ..
  # Only the app uses Sparkle (design of add-software-update). scripts/sparkle-tools.sh holds the pin
  # of this version, its commit for scripts/generate-project.sh, and its command line tools.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
targets:
  Moneten:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
        buildPhase: resources
        excludes:
          - "CatalogKeys/**"
      # The two public keys of the catalog, copies of keys/ in MonetenApp/moneten-extensions.
      # ExtensionLibrary loads current.pub and next.pub from Contents/Resources.
      - path: Resources/CatalogKeys/current.pub
        buildPhase: resources
      - path: Resources/CatalogKeys/next.pub
        buildPhase: resources
    dependencies:
      - package: MonetenKit
        product: Domain
      - package: MonetenKit
        product: Storage
      - package: MonetenKit
        product: Import
      - package: MonetenKit
        product: Sync
      - package: MonetenKit
        product: FinTS
      # The scripted connector of the previews and of the debug harness.
      - package: MonetenKit
        product: SyncTesting
      - package: MonetenKit
        product: ExtensionHost
      - package: MonetenKit
        product: ExtensionConnector
      - package: MonetenKit
        product: ExtensionCatalog
      - package: Sparkle
      # The process of one extension session, which ExtensionHostClient starts from Contents/Helpers.
      - target: MonetenExtensionHost
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers
    settings:
      base:
        MARKETING_VERSION: 0.0.1
        CURRENT_PROJECT_VERSION: 1
        # The part of the version after the hyphen, such as beta.1. scripts/build-app.sh sets it from MONETEN_VERSION.
        MONETEN_PRE_RELEASE: ""
        # The public update key of Sparkle; its private key is the secret SPARKLE_ED_PRIVATE_KEY. Replace it
        # only as "Replace a leaked update key" in docs/releasing.md describes.
        MONETEN_UPDATE_PUBLIC_KEY: pBl+BrUbm7aXxu/Fv4ayqMYG2L5N+q0p59fOfop2xcQ=
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.Moneten
        PRODUCT_NAME: Moneten
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        # Moneten.entitlements, or MonetenLocal.entitlements for a Release build without a team (App/Signing.xcconfig).
        CODE_SIGN_ENTITLEMENTS: $(MONETEN_APP_ENTITLEMENTS)
        # A muted slate blue for selections and controls, calmer than the system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_HARDENED_RUNTIME: $(MONETEN_HARDENED_RUNTIME)
        # The compiler writes the key of each looked-up literal, which Xcode adds to the catalog.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
      configs:
        # The public half of the test key in Fixtures/update. A Debug build looks for updates only in MONETEN_FEED_URL.
        Debug:
          MONETEN_UPDATE_PUBLIC_KEY: KCVfr5htNQFhNzFn1PReJQq2egc+Ny8yWsVLI1FEs/g=
        # The placeholder: a Perf build must not look for updates while scripts/perf-check.sh measures it.
        Perf:
          MONETEN_UPDATE_PUBLIC_KEY: none
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERF_HARNESS
  # The host process of ADR 0015: the main of the package target MonetenExtensionHost, with the app sandbox
  # and only outgoing connections. No base entitlements are added, so a debug build cannot be attached to either.
  MonetenExtensionHost:
    type: tool
    platform: macOS
    sources:
      - path: ../Sources/MonetenExtensionHost
    dependencies:
      - package: MonetenKit
        product: ExtensionHost
    settings:
      base:
        PRODUCT_NAME: MonetenExtensionHost
        PRODUCT_BUNDLE_IDENTIFIER: io.github.alexander-schneider.Moneten.ExtensionHost
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        CODE_SIGN_ENTITLEMENTS: ExtensionHost.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        ENABLE_HARDENED_RUNTIME: $(MONETEN_HARDENED_RUNTIME)
        SKIP_INSTALL: YES
  # The command line tool of add-extension-developer-tools, which the package builds as the product ext.
  # It is here so that Periphery sees its uses of the libraries.
  ext:
    type: tool
    platform: macOS
    sources:
      - path: ../Tools/ext
    dependencies:
      - package: MonetenKit
        product: Domain
      - package: MonetenKit
        product: ExtensionHost
      - package: MonetenKit
        product: ExtensionConnector
    settings:
      base:
        PRODUCT_NAME: ext
        SKIP_INSTALL: YES
schemes:
  ext:
    build:
      targets:
        ext: all
  Moneten:
    build:
      targets:
        Moneten: all
    run:
      config: Debug
    archive:
      config: Release
