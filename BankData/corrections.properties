# Corrections of the project to the bank list of hbci4java, in its format: a Bankleitzahl, "=", and the
# fields name|place|BIC|check method|RDH address|FinTS address|RDH version|FinTS version|.
# A line replaces the entry of its Bankleitzahl, or adds one. scripts/bank-data.py build applies them, and the
# workflow bank-data.yml publishes the result. docs/releasing.md says when to add a line.
